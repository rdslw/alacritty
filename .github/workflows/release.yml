name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Create release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 && exit 0
          gh release create "$TAG" \
            --verify-tag \
            --latest \
            --title "Alacritty $TAG" \
            --notes "Fork build of Alacritty $TAG from ${GITHUB_REPOSITORY}."

  macos:
    needs: create-release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install scdoc
      - name: Install targets
        run: rustup update && rustup target add aarch64-apple-darwin && rustup target add x86_64-apple-darwin
      - name: Test
        run: cargo test --release --target=x86_64-apple-darwin
      - name: Build ARM
        run: cargo build --release --target=aarch64-apple-darwin
      - name: Make DMG
        run: make dmg-universal
      - name: Upload Application
        run: |
          mv ./target/release/osx/Alacritty.dmg "./Alacritty-$TAG.dmg"
          gh release upload "$TAG" "./Alacritty-$TAG.dmg" --clobber

  linux:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install cmake pkg-config libfreetype6-dev libfontconfig1-dev \
            libxcb-xfixes0-dev libxkbcommon-dev python3 scdoc
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package binary
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          name="Alacritty-$TAG-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp ./target/release/alacritty "$name/"
          tar -czf "$name.tar.gz" "$name"
      - name: Upload binary
        run: gh release upload "$TAG" "./Alacritty-$TAG-linux-${{ matrix.arch }}.tar.gz" --clobber

  assets:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install scdoc
      - name: Generate manpages
        run: |
          scdoc < extra/man/alacritty.1.scd | gzip -c > "./alacritty.1.gz"
          scdoc < extra/man/alacritty-msg.1.scd | gzip -c > "./alacritty-msg.1.gz"
          scdoc < extra/man/alacritty.5.scd | gzip -c > "./alacritty.5.gz"
          scdoc < extra/man/alacritty-bindings.5.scd | gzip -c > "./alacritty-bindings.5.gz"
          scdoc < extra/man/alacritty-escapes.7.scd | gzip -c > "./alacritty-escapes.7.gz"
      - name: Upload Assets
        run: |
          mv ./extra/logo/alacritty-term.svg ./Alacritty.svg
          gh release upload "$TAG" --clobber \
            ./Alacritty.svg \
            ./alacritty.1.gz \
            ./alacritty-msg.1.gz \
            ./alacritty.5.gz \
            ./alacritty-bindings.5.gz \
            ./alacritty-escapes.7.gz \
            ./extra/completions/alacritty.bash \
            ./extra/completions/alacritty.fish \
            ./extra/completions/_alacritty \
            ./extra/linux/Alacritty.desktop \
            ./extra/alacritty.info
